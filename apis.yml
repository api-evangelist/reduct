apis:
- name: Reduct API
  description: >-
    RESTful API (version 3) providing broad access across a Reduct workspace:
    projects, recordings, media, redactions and redaction motions, highlights,
    comments, and reels, plus transcript retrieval, transcription status, media
    upload/import, reel publish/unpublish, recording languages, and workspace
    member access levels. Authenticated with a per-workspace API key generated
    via the backstage interface. Available on Professional and Enterprise plans.
