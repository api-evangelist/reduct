name: Reduct
description: >-
  Reduct (reduct.video) is a video intelligence platform that transcribes,
  translates, redacts, searches, annotates, and edits audio and video through a
  text-based editor. Teams in legal, qualitative research, film and production,
  marketing, and education use it to find and share what matters across hours of
  footage. Reduct exposes a RESTful API (current version 3) giving broad
  programmatic access across a workspace — projects, recordings, media,
  transcripts, redactions and redaction motions, highlights, comments, and reels
  — with per-workspace API-key authentication on the Professional and Enterprise
  plans. The company is SOC 2 Type II certified with GDPR and HIPAA support.
